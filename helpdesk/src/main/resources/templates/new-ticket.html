<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>New ticket | Helpdesk</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="max-w-6xl mx-auto px-8 py-10">

    <h1 class="text-3xl font-bold mb-2">New ticket</h1>

    <p class="text-slate-500 mb-8">
        Create a new support request.
    </p>

    <section class="max-w-3xl bg-white rounded-xl border border-slate-200 shadow-sm p-8">

        <h2 class="text-xl font-semibold mb-6">
            Ticket information
        </h2>

        <form th:action="@{/tickets/new}" method="post"
              class="space-y-6">

            <div>
                <label for="title" class="block font-medium mb-2">
                    Title
                </label>

                <input id="title"
                       type="text"
                       name="title"
                       placeholder="Enter a short title"
                       required
                       maxlength="255"
                       class="input input-bordered w-full bg-white">
            </div>

            <div>
                <label for="description" class="block font-medium mb-2">
                    Description
                </label>

                <textarea id="description"
                          name="description"
                          placeholder="Describe your problem..."
                          required
                          rows="7"
                          class="textarea textarea-bordered w-full bg-white"></textarea>

                <p class="text-sm text-slate-500 mt-2">
                    Provide enough information for an agent to help you.
                </p>
            </div>

            <div class="flex items-center justify-end gap-3 border-t border-slate-200 pt-6">

                <a th:href="@{/tickets}" class="btn btn-outline">
                    Cancel
                </a>

                <button type="submit" class="btn btn-primary">
                    Create ticket
                </button>

            </div>

        </form>

    </section>

</main>

</body>
</html>
