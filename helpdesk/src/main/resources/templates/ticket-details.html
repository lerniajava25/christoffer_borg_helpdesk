<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ticket details</title>
</head>
<body>

<h1 th:text="${ticket.title}"></h1>

<h2>Description</h2>
<p th:text="${ticket.description}"></p>

<h2>Status</h2>
<p th:text="${ticket.status}"></p>

<h2>Created at</h2>
<p th:text="${ticket.createdAt}"></p>

<h2>Last modified</h2>
<p th:text="${ticket.lastModified}"></p>

<h2>Comments</h2>

<div th:each="comment : ${comments}">
    <p th:text="${comment.author.username}"></p>
    <p th:text="${comment.content}"></p>
</div>

<form th:action="@{/tickets/{id}/comments(id=${ticket.id})}" method="post">
<h2>Add Comment</h2>
    <textarea name="content"></textarea>
    <br>
    <button type="submit">Post comment</button>
</form>

<a href="/tickets">Back to my tickets</a>

</body>
</html>
